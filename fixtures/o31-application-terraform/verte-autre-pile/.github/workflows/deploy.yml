name: deploiement-dev
on: workflow_dispatch
jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Appliquer les reglages
        run: node forge-ops/scripts/appliquer-terraform.mjs infra --projet ${{ vars.SUPABASE_PROJECT_REF }} --executer --sortie application.json
      - name: Appliquer le reseau
        working-directory: infra-docker
        run: terraform apply -auto-approve
