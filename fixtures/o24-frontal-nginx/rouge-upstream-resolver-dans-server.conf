# Rouge : « resolve » sans resolver dans le bloc upstream ni dans http ; celui du server ne sert pas à l'upstream
# (nginx -t : « no resolver defined to resolve names at run time in upstream »).
upstream appli {
    zone appli 64k;
    server app:8000 resolve;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=10s;
    location / {
        proxy_pass http://appli;
    }
}
