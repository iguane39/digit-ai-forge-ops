# Rien à juger (SKIP, jamais un PASS vide) : fastcgi_pass, uwsgi_pass, scgi_pass et grpc_pass vers une adresse IP, un socket unix
# ou localhost ne se résolvent pas (TF-2177).
# fastcgi_pass app:9000;   <- en commentaire : ne compte pas
server {
    listen 80;
    http2 on;
    location /php/ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    location /uwsgi/ {
        uwsgi_pass 10.200.0.5:3031;
    }
    location /scgi/ {
        scgi_pass localhost:4000;
    }
    location /grpc/ {
        grpc_pass grpc://[::1]:50051;
    }
    location /grpc-unix/ {
        grpc_pass unix:/run/grpc.sock;
    }
}
