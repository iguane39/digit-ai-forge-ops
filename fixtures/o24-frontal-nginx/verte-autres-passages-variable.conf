# Vert : fastcgi_pass, uwsgi_pass, scgi_pass et grpc_pass reçoivent chacun une variable, avec un resolver qui porte valid= (TF-2177).
server {
    listen 80;
    http2 on;
    resolver 127.0.0.11 valid=10s;
    set $amont_fastcgi "app:9000";
    set $amont_uwsgi "uwsgi://app:3031";
    set $amont_scgi "app:4000";
    set $amont_grpc "grpc://app:50051";

    location /php/ {
        fastcgi_pass $amont_fastcgi;
    }
    location /uwsgi/ {
        uwsgi_pass $amont_uwsgi;
    }
    location /scgi/ {
        scgi_pass $amont_scgi;
    }
    location /grpc/ {
        grpc_pass $amont_grpc;
    }
}
