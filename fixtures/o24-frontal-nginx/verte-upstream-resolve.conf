# Vert : groupe upstream dont le serveur porte « resolve » (nginx 1.27.3 et plus), avec sa zone et son resolver.
# Le resolver se pose dans le bloc upstream (ou dans http) : posé dans server, nginx le refuse pour un upstream.
upstream appli {
    zone appli 64k;
    resolver 127.0.0.11 valid=10s;
    server app:8000 resolve;
}

server {
    listen 80;
    location / {
        proxy_pass http://appli;
    }
}
