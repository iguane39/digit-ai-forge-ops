# Rien à juger (SKIP, jamais un PASS vide) : une adresse IP, un socket unix et localhost ne se résolvent pas.
# proxy_pass http://app:8000;   <- en commentaire : ne compte pas
server {
    listen 80;
    location /api/ {
        proxy_pass http://10.200.0.5:8000;
    }
    location /local/ {
        proxy_pass http://unix:/var/run/app.sock:/;
    }
    location /h/ {
        proxy_pass http://localhost:9000;
    }
}
