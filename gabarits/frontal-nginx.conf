# Gabarit forge-ops : frontal nginx d'un lab Docker (TF-2165, Produit-86 lot 20261104a RO-3).
#
# Le fait du 04/11/2026 : `proxy_pass http://app:8000;` résout « app » UNE fois, au chargement de la
# configuration. Après l'ajout de conteneurs au réseau interne, l'application recréée a changé d'adresse et le
# frontal a rendu 502 (santé 1/3, 1 déploiement en échec à 12:31).
#
# Ici l'amont se résout à CHAQUE requête : `proxy_pass` reçoit une variable, et nginx la résout par le
# résolveur déclaré. 127.0.0.11 est le serveur DNS embarqué de Docker sur un réseau défini par l'utilisateur ;
# `valid=10s` remplace le TTL de la réponse, l'adresse d'une application recréée est reprise en 10 secondes.
#
# À poser dans /etc/nginx/conf.d/ de l'image nginx. Remplacer app:8000 par le service et le port de l'amont.
# Jugé par l'oracle O-24 : node oracles/oracle-ops.mjs --frontal-nginx <fichier.conf ou dossier>
# Référentiel : references/RESEAU-ET-FRONTAL-DOCKER.md

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    # L'amont dans une variable : sans elle, proxy_pass le résout au chargement et le fige.
    set $amont "http://app:8000";

    location / {
        proxy_pass $amont;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
